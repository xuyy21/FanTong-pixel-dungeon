##wndrunes
runes.runes.wndlabel=試驗符術
runes.runes.wndtitle=點擊符文來調整排列組合。每次試驗符文組合會消耗一個符文粉塵。\n\n你已經試驗了_%1$d/%2$d_種符文組合。
runes.runes.testbtn_yes=試驗
runes.runes.testbtn_no=該組合已經試過
runes.runes.test_success=你試驗出了%s！
runes.runes.test_fall=這個符文組合是無效的...
runes.runes.no_ash=你沒有符文粉塵。
runes.runes.randomtest=隨機試驗
runes.runes.allknown=你已經試驗過全部符文組合。

##wndspell
runes.wndspell.cast_title=施放一個符術
runes.wndspell.info_title=符術信息
runes.wndspell.cast_desc_desktop=選擇一個要施放的符術，右鍵單擊獲取信息。
runes.wndspell.cast_desc_mobile=選擇一個要施放的符術，或按信息按鈕切換為信息模式。
runes.wndspell.info_desc=選擇一個要了解的符術，或按法器按鈕切換為施法模式。
runes.wndspell.cast=施法
runes.wndspell.info=信息
runes.wndspell.cant_cast=你無法施放這個符術。
runes.wndspell.fault=符術失敗了！

runes.runicash.name=符文粉塵
runes.runicash.desc=一撮富含魔力的粉塵，是繪製符文的優良材料。你可以使用符文粉塵在法器上試驗符文組合。\n\n符文粉塵通過在煉金鍋中分解鑒定且無詛咒的武器或護甲獲得。

##spells
runes.spells.spell.name=未知符術
runes.spells.spell.desc=測試用的未知符術，無效果。
runes.spells.spell.shortdesc=測試用符術。
runes.spells.spell.type=這是%d階%s符術。
runes.spells.spell.normal=常規
runes.spells.spell.holy=神聖
runes.spells.spell.nature=自然
runes.spells.spell.energetic=高能
runes.spells.spell.physical=強化
runes.spells.spell.inverse=逆熵
runes.spells.spell.overrunes=這個符術通常會導致_%d回合_的符文過載。
runes.spells.spell.level_punishment=目前地牢的深度不足，使用這個高階符術導致了符文過載加重。

runes.spells.spell.prompt=選擇一個目標
runes.spells.spell.no_target=那裏沒有任何目標。
runes.spells.spell.invalid_target=你無法以那個位置為目標。
runes.spells.spell.invalid_enemy=你無法以那個敵人為目標。

runes.spells.spell$overrunes.name=符文過載
runes.spells.spell$overrunes.desc=使用符術逸散的符文幹擾了你的符文力量，如果剩余回合過多可能導致你的符術失敗。\n\n當你處於背水一戰時，你必須和BOSS戰鬥才能降低符文過載。\n\n剩余過載回合：%s回合。這通常會導致_%s%%_的符術失敗概率。

###normal spells
runes.spells.eating.name=進食秘法
runes.spells.eating.short_desc=觸發一次進食效果
runes.spells.eating.desc=英雄立即觸發一次進食天賦效果，但是不會回復飽腹度。

runes.spells.see_though.name=透視容器
runes.spells.see_though.short_desc=觀察容器的內容物。
runes.spells.see_though.desc=英雄可以透視觀察到一個寶箱、骸骨或墳墓內的物品。如果有多件物品堆疊，只能看見最頂上的物品。\n\n這個符術不消耗時間。
runes.spells.see_though.no_item=這個容器中沒有物品！

runes.spells.runiclance.name=符文穿刺
runes.spells.runiclance.short_desc=發射光束攻擊穿透的單位。
runes.spells.runiclance.desc=英雄發射一道3格長的光束，對光束穿透的單位造成一次武器攻擊，並且通常提高_100%的傷害和200%的附魔強度_。\n\n如果英雄所用武器超重，那麽每超1力會額外增加20回合的符文過載。

runes.spells.junior_phantom.name=初級幻影
runes.spells.junior_phantom.short_desc=召喚一個初級幻影
runes.spells.junior_phantom.desc=在視野內召喚一個不能行動且一碰就碎的幻影，但是幻影飄忽不定難以命中。幻影會吸引敵人優先攻擊。
runes.spells.junior_phantom$phantom.name=初級幻影
runes.spells.junior_phantom$phantom.desc=一個不能行動且一碰就碎的幻影，但是幻影飄忽不定難以命中。幻影會吸引視野內的敵人優先攻擊自身。
runes.spells.junior_phantom$phantom.discover_hint=你可通過某種符術發現該單位

runes.spells.senior_phantom.name=高級幻影
runes.spells.senior_phantom.short_desc=召喚一個高級幻影
runes.spells.senior_phantom.desc=在視野內召喚一個不能行動的幻影，可以承受_一定量的傷害_。幻影會吸引敵人優先攻擊。
runes.spells.senior_phantom$phantom.name=高級幻影
runes.spells.senior_phantom$phantom.desc=一個不能行動但是可以承受一定傷害的幻影。幻影會吸引視野內的敵人優先攻擊自身。
runes.spells.senior_phantom$phantom.discover_hint=你可通過某種符術發現該單位

runes.spells.runicboom.name=符文爆發
runes.spells.runicboom.short_desc=製造一次爆炸
runes.spells.runicboom.desc=在視野內的一格位置製造一次小型爆炸，傷害通常_等於炸彈_。

runes.spells.animate_armor.name=活化護甲
runes.spells.animate_armor.short_desc=將一件護甲活化
runes.spells.animate_armor.desc=選擇背包中的一件護甲，在英雄身邊變成一個活化護甲。活化護甲會在召喚處附近徘徊並自動攻擊敵人，詛咒的活化護甲則會陷入狂亂。活化護甲的攻擊力較弱，但是可以使用護甲的防禦力和刻印。\n\n活化護甲死亡後會變回普通的護甲。
runes.spells.animate_armor.no_space=你周圍沒有空間...
runes.spells.animate_armor.succeed_not_cursed=這件護甲從背包中跳了出來！
runes.spells.animate_armor.succeed_cursed=這件護甲是詛咒的！活化護甲陷入狂亂！
runes.spells.animate_armor$animated_armor.name=活化%s
runes.spells.animate_armor$animated_armor.desc=這件_%s_被活化，徘徊於此處，正在自動攻擊接近的敵人。活化護甲的攻擊力較弱，但是可以使用護甲的防禦力和刻印。\n\n活化護甲死亡後會變回普通的護甲。
runes.spells.animate_armor$animated_armor.cursed=由於這件護甲被詛咒，活化護甲現在陷入狂亂，敵我不分！
runes.spells.animate_armor$animated_armor.discover_hint=你可通過某種符術發現該單位

###holy spells
runes.spells.auraofprotection.name=守禦靈光
runes.spells.auraofprotection.short_desc=強化聖騎士與附近盟友的防禦。
runes.spells.auraofprotection.desc=聖騎士開始輻射出保護性能量，在自身周圍形成一片持續20回合的守禦靈光。在聖騎士2格範圍內的任何盟友(包括聖騎士自身)都會獲得%1$d%%的傷害減免與%2$d%%的聖騎士護甲刻印強化。\n\n該傷害減免優先於其他減傷效果(例如護甲)生效。刻印強化會始終生效，但如果某單位(例如聖騎士自身、虹衛)已從聖騎士的刻印中獲得效益，則該符術無法使其再次從中獲得效益。
runes.spells.auraofprotection$aurabuff.name=守禦靈光
runes.spells.auraofprotection$aurabuff.desc=聖騎士正在自身周圍輻射出保護性能量。\n\n附近的任何盟友(包括聖騎士自身)都會獲得傷害減免與聖騎士護甲刻印強化。\n\n剩余回合數：%s

runes.spells.beamingray.name=呼神護衛
runes.spells.beamingray.no_space=那裏沒有空間讓你的盟友出現。
runes.spells.beamingray.out_of_range=那個位置超出了範圍。
runes.spells.beamingray.short_desc=傳送你的盟友並使其獲得傷害加成。
runes.spells.beamingray.desc=牧師引導其盟友的力量為可將傳送盟友至某個位置的光束。如果光束投射到敵人上，傳送光束會將盟友傳送至敵人附近並將其作為攻擊目標。\n\n傳送光束的最大範圍為%1$d格，並使萬物一心對4格範圍內最近敵人的傷害加成提升至%2$d%%，持續10回合。該符術還可以傳送通常情況下無法移動的盟友，但若如此則傳送光束範圍減半。
runes.spells.beamingray$beamingrayboost.name=呼神護衛
runes.spells.beamingray$beamingrayboost.desc=該盟友近期被呼神護衛的傳送光束傳送，獲得傳送後對最近敵人的傷害加成。萬物一心不會在該效果生效時結束。\n\n剩余回合數：%s

runes.spells.blessspell.name=神聖祝福
runes.spells.blessspell.short_desc=使英雄獲得祝福和護盾，使其他單位獲得祝福和治療。
runes.spells.blessspell.desc=英雄賜自身或視野內一個單位神聖祝福。\n\n當神聖祝福以英雄自身為目標時效果更弱，通常使其獲得_%1$d回合賜福與%2$d點護盾_。\n\n當神聖祝福以其他單位為目標時效果更強，通常使其獲得_%3$d回合賜福與%4$d點治療_。溢出治療將被轉化為護盾。

runes.spells.bodyform.name=體之位格
runes.spells.bodyform.short_desc=為三位一體選擇附魔或刻印。
runes.spells.bodyform.desc=牧師選擇一個本局已鑒定的附魔或刻印並使三位一體幻化其效果。\n\n使用三位一體時，牧師會獲得所選附魔或刻印的效果%d回合。該臨時附魔或刻印具有正常附魔或刻印本應具有的任何效果。\n\n該符術會刷新三位一體當前已幻化的任何體之位格效果。
runes.spells.bodyform$bodyformbuff.name=體之位格
runes.spells.bodyform$bodyformbuff.desc=位格符術體之位格正使你獲得附魔或刻印的效果，仿佛你已將其裝備於當前的武器或護甲。\n\n註意，體之位格無法復製你已經裝備的裝備效果。\n\n當前的效果：%1$s\n\n剩余回合數：%2$s

runes.spells.cleanse.name=神聖凈化
runes.spells.cleanse.short_desc=清除減益並獲得護盾。
runes.spells.cleanse.desc=英雄清除自身和視野內盟友的所有減益效果。此後所有受影響的單位通常還將獲得_%d點護盾_。

runes.spells.divinesense.name=神聖感知
runes.spells.divinesense.short_desc=短時間內獲得大範圍的靈視感知。
runes.spells.divinesense.desc=英雄將其感知集中在周遭環境上，獲得通常持續_30回合_，%d格範圍的靈視感知。該符術施法不耗時。
runes.spells.divinesense$divinesensetracker.name=神聖感知
runes.spells.divinesense$divinesensetracker.desc=該單位暫時能以其靈視感知看到附近其他生物！\n\n剩余回合數：%s

runes.spells.divineintervention.name=神聖幹預
runes.spells.divineintervention.short_desc=大幅強化牧師與盟友的護盾。
runes.spells.divineintervention.desc=牧師借助聖典向自身與盟友體內註入無人能敵的神力，提升全體護盾至%1$d點並延長%2$d回合超凡升天。該符術無可匹敵的防禦力與其極高的充能消耗相匹配。\n\n與超凡升天提供的其他護盾一樣，這種護盾不會正常衰減，但在超凡升天結束時會立即消失。

runes.spells.flash.name=天堂階梯
runes.spells.flash.prompt=選擇一個位置
runes.spells.flash.short_desc=傳送至附近一個位置。
runes.spells.flash.desc=牧師在附近的位置引導出超凡升天的神力並傳送到那裏。天堂階梯可以將牧師傳送至任何在範圍內且未被占據的已探索區域。在同次超凡升天中，每次使用該符術時都會消耗更多的聖典充能。

runes.spells.guidinglight.name=神導之光
runes.spells.guidinglight.short_desc=造成遠程魔法必中傷害。
runes.spells.guidinglight.desc=英雄發射一束魔能光矢攻擊目標，通常造成_2~8點傷害_並將其啟明。對啟明敵人的下一次不超力的物理攻擊必定命中。
runes.spells.guidinglight$illuminated.name=啟明
runes.spells.guidinglight$illuminated.desc=該單位因被神導之光擊中而啟明。啟明的照度不足以照亮周圍區域，但其魔法會使英雄對敵人的攻擊更容易命中。

runes.spells.hallowedground.name=神聖領域
runes.spells.hallowedground.prompt=選擇一個位置
runes.spells.hallowedground.short_desc=治療盟友，減速敵人並在範圍內擴散植被。
runes.spells.hallowedground.desc=英雄將其神聖魔法聚集在附近的地面上，創造一片%1$dx%1$d範圍，通常持續_20回合_的神聖領域。\n\n施法時，符術通常會立即治療所有盟友_15點生命值_(未受傷的的盟友和英雄會獲得護盾)，短暫纏繞敵人並擴散矮草。\n\n神聖領域每回合會治療盟友1點生命值(未受傷的的盟友和英雄會獲得護盾)，殘廢敵人並隨機催生高草。\n\n神聖領域會被火焰摧毀。並且如果被動恢復效果被禁用，神聖領域將只會產生枯草。
runes.spells.hallowedground$hallowedterrain.desc=此處已經化為神聖領域。神聖領域會減速敵人、治療盟友並擴散植被。

runes.spells.holyintuition.name=神聖預知
runes.spells.holyintuition.prompt=選擇一個物品
runes.spells.holyintuition.cursed=你感覺到這件物品裏潛伏著一股充滿惡意的魔力。
runes.spells.holyintuition.uncursed=這個物品沒有被詛咒。
runes.spells.holyintuition.short_desc=鑒定一個物品有無詛咒。
runes.spells.holyintuition.desc=英雄將其感知集中在一個物品上，不必裝備物品就能判斷其詛咒有無。

runes.spells.holylance.name=神聖標槍
runes.spells.holylance.short_desc=造成高額遠程魔法傷害。
runes.spells.holylance.desc=英雄將大量能量聚集為一柄致命的投擲用聖槍。聖槍通常造成_%1$d~%2$d點傷害_，並且必定對亡靈和惡魔目標造成最大傷害。\n\n該符術有30回合的冷卻。
runes.spells.holylance$lancecooldown.name=神聖標槍-冷卻
runes.spells.holylance$lancecooldown.desc=英雄近期施放了神聖標槍，必須等待一段時間才能再次施放。\n\n剩余回合數：%s

runes.spells.holyward.name=神聖護甲
runes.spells.holyward.glyph_name=神聖%s
runes.spells.holyward.glyph_desc=這個刻印略微增加了護甲可防禦的傷害量。
runes.spells.holyward.short_desc=臨時覆蓋刻印以強化護甲防禦。
runes.spells.holyward.desc=英雄賦予其身穿護甲神聖刻印，增加護甲1點防禦。該符術施法不耗時。\n\n該刻印持續50回合，並會在持續時間內覆蓋任何護甲已有的正面刻印。英雄即使沒有護甲也能觸發神聖刻印效果。
runes.spells.holyward.desc_paladin=_聖騎士施放該符術時效果更強。_神聖護甲的額外傷害防禦提升至3點並不再覆蓋已有的附魔，而在神聖護甲生效時施放其他符術所使用的每點充能都會延長10回合的符術效果。
runes.spells.holyward$holyarmbuff.name=神聖護甲
runes.spells.holyward$holyarmbuff.desc=英雄已賦予其身穿護甲神聖刻印，臨時覆蓋任何已有刻印並使護甲額外防禦1點傷害。\n\n剩余回合數：%s
runes.spells.holyward$holyarmbuff.desc_paladin=聖騎士已賦予其身穿護甲神聖刻印，使護甲額外防禦3點傷害。\n\n神聖護甲生效時施放其他符術所消耗的每點充能都會延長符術效果10回合。\n\n剩余回合數：%s

runes.spells.holyweapon.name=神聖武器
runes.spells.holyweapon.ench_name=神聖%s
runes.spells.holyweapon.ench_desc=被神聖武器攻擊的敵人會受到額外魔法傷害。
runes.spells.holyweapon.short_desc=臨時覆蓋附魔以強化武器傷害。
runes.spells.holyweapon.desc=英雄賦予其手持武器神聖附魔，使武器每次攻擊敵人額外造成2點魔法傷害。該符術施法不耗時。\n\n該附魔持續50回合，並會在持續時間內覆蓋任何武器已有的正面附魔。赤手空拳攻擊敵人也能觸發神聖附魔效果。
runes.spells.holyweapon.desc_paladin=_聖騎士施放該符術時效果更強。_神聖武器的額外魔法傷害提升至6點並不再覆蓋已有的附魔，而在神聖武器生效時施放其他符術所使用的每點充能都會延長10回合的符術效果。
runes.spells.holyweapon$holywepbuff.name=神聖武器
runes.spells.holyweapon$holywepbuff.desc=英雄已賦予其手持武器神聖附魔，臨時覆蓋任何已有附魔並使武器每次攻擊額外造成2點魔法傷害。\n\n剩余回合數：%s
runes.spells.holyweapon$holywepbuff.desc_paladin=聖騎士已賦予其手持武器神聖附魔，使其攻擊額外造成6點魔法傷害。\n\n神聖武器生效時施放其他符術所消耗的每點充能都會延長10回合的符術效果。\n\n剩余回合數：%s

runes.spells.judgement.name=終末天啟
runes.spells.judgement.short_desc=對視野內所有敵人造成傷害。
runes.spells.judgement.desc=牧師撕裂蒼穹，以聖光之名審判視野內所有敵人。符術會在造成%1$d~%2$d點傷害的基礎之上，再根據牧師自進入超凡升天以來(或自上次施放終末天啟以來)的每次施法額外造成33%%傷害。\n\n當前終末天啟會造成%3$d~%4$d點傷害。

runes.spells.layonhands.name=聖療之觸
runes.spells.layonhands.short_desc=立即治療附近一個單位或使聖騎士獲得護盾。
runes.spells.layonhands.desc=聖騎士以其雙手引導出神聖能量，治療或保護其所觸的任何單位。\n\n聖騎士可施放該符術使附近任何單位獲得%1$d點治療，或使自身獲得%1$d點護盾。該符術的溢出治療將被轉化為護盾。\n\n該符術可被立即施放、重復施放，但無法立即施加超過三次施法數值的護盾。

runes.spells.lifelinkspell.name=血色羈絆
runes.spells.lifelinkspell.short_desc=與盟友共享所受傷害，並使其獲得傷害減免。
runes.spells.lifelinkspell.desc=牧師強化自身與其強化盟友之間的生命聯結。該強化版生命聯結持續%1$d回合，會使英雄與其盟友共享任何所受傷害，並使萬物一心的傷害減免提升至%2$d%%。註意，傷害共享的優先級低於護甲，但高於萬物一心的傷害減免。\n\n生命聯結效果生效時，對任何一方施放3階及以下的增益型牧師符術對雙方均有效果。
runes.spells.lifelinkspell$lifelinkspellbuff.name=血色羈絆
runes.spells.lifelinkspell$lifelinkspellbuff.desc=牧師近期對該盟友施放了血色羈絆以建立生命聯結。\n\n除生命聯結的通常效果外，該單位還會獲得傷害減免，任何增益型牧師符術對牧師與該盟友施放時對雙方均生效，並且萬物一心不會在該效果生效時結束。\n\n剩余回合數：%s

runes.spells.mindform.name=智之位格
runes.spells.mindform.short_desc=為三位一體選擇法杖或投武。
runes.spells.mindform.desc=牧師選擇一個本局已鑒定的法杖或投武並使三位一體幻化其效果。\n\n使用三位一體時，牧師會使用所選物品單次攻擊的%d級效果。該次攻擊觸發正常使用該物品本應觸發的所有效果。\n\n該符術會刷新三位一體當前已有的任何智之位格效果。

runes.spells.mnemonicprayer.name=祈願詩篇
runes.spells.mnemonicprayer.short_desc=延長盟友/敵人的增益/減益效果。
runes.spells.mnemonicprayer.desc=英雄念誦出通常能延長_%1$d回合_特定目標所有增益或減益效果的經文。該符術施法不耗時。增益對盟友(包括英雄自身)持續時間更久，減益對敵人持續時間更久。\n\n祈願詩篇只能延長一次特定目標的增益或減益效果，並且不能延長來自護甲技能的增益效果。

runes.spells.radiance.name=破曉輻光
runes.spells.radiance.short_desc=啟明並暫時擊暈視野內敵人。
runes.spells.radiance.desc=祭司通體迸出聖光，擊暈所有視野內敵人3回合並使其如同被神導之光擊中般啟明。若敵人已被啟明，符術會觸發啟明的額外傷害並將其再次啟明。若本層視野較暗，符術還會使祭司發光100回合。

runes.spells.recallinscription.name=符文復製
runes.spells.recallinscription.short_desc=重復最近使用的符石或卷軸效果。
runes.spells.recallinscription.desc=英雄使用神聖魔法復製最近使用的符文以再次觸發%s回合前使用的卷軸或符石的魔法效果。\n\n符文復製不能復製升級卷軸，充能消耗根據最近一次使用的物品變化而變化：符石2點充能、卷軸3點充能、秘卷4點充能。復製嬗變卷軸或嬗變/升級卷軸的符石/秘卷時，充能消耗還會翻倍。
runes.spells.recallinscription$useditemtracker.name=近期已使用符文
runes.spells.recallinscription$useditemtracker.desc=英雄近期已使用一個兼容符文復製符術效果的物品，可以通過施法再次觸發物品效果。\n\n已使用物品：%1$s\n\n剩余回合數：%2$s

runes.spells.shieldoflight.name=神聖護盾
runes.spells.shieldoflight.short_desc=獲得僅對單個目標生效的臨時護甲。
runes.spells.shieldoflight.desc=英雄在自身與敵人間創造了一面薄弱的聖盾，通常增加其護甲對該敵人持續_5回合_的%1$d~%2$d點防禦。\n\n該符術施法不耗時，但不能同時對多個目標使用。
runes.spells.shieldoflight$shieldoflighttracker.name=神聖護盾
runes.spells.shieldoflight$shieldoflighttracker.desc=一面薄弱的聖盾立於該單位與敵人之間。聖盾的強度不足以完全防禦攻擊，但能將其減弱%1$d~%2$d。\n\n剩余回合數：%s

runes.spells.spiritform.name=魂之位格
runes.spells.spiritform.short_desc=為三位一體選擇戒指或神器。
runes.spells.spiritform.desc=牧師選擇本局已鑒定的戒指或神器(神聖法典除外)並使三位一體幻化其效果。\n\n如果所選物品為戒指，三位一體會獲得所選戒指的%1$d級效果20回合。\n\n如果所選物品為神器，三位一體會復製所選神器的%2$d級效果。三位一體使用神器時的具體效果與護甲充能消耗因神器而異。\n\n該符術會刷新三位一體當前已幻化的任何魂之位格效果。
runes.spells.spiritform$spiritformbuff.name=魂之位格
runes.spells.spiritform$spiritformbuff.desc=位格符術魂之位格正使你獲得物品的效果，仿佛你已將其裝備於裝備欄。\n\n註意，魂之位格無法復製你已經裝備的裝備效果。\n\n當前的效果：%1$s\n\n剩余回合數：%2$s

runes.spells.smite.name=至聖斬擊
runes.spells.smite.short_desc=一次帶有額外傷害與附魔強化的必中攻擊。
runes.spells.smite.desc=聖騎士為一次致命的近戰攻擊註入正義之力。\n\n在造成正常近戰傷害的基礎上，至聖斬使不超力的攻擊必定命中，附有300%%的附魔強化並造成%1$d~%2$d點額外魔法傷害。\n\n至聖斬的額外魔法傷害隨聖騎士的等級成長而成長，並且至聖斬必定對惡魔和亡靈敵人造成最大額外魔法傷害。

runes.spells.stasis.name=星界投射
runes.spells.stasis.short_desc=將盟友移出地牢並凝滯其狀態。
runes.spells.stasis.desc=牧師將其與盟友的聯系集中於自身，使盟友暫時化為牧師體內的某種凝滯狀態的能量。盟友最多會被凝滯%d回合，而在凝滯狀態下，其所有的正面效果均不受時間影響。\n\n符術效果自然結束時盟友會出現在牧師附近，牧師也可無消耗地立即再次施放該符術以提前結束符術效果。星界投射還可移動無法移動的盟友，但無法將其跨層移動。
runes.spells.stasis$stasisbuff.name=星界投射
runes.spells.stasis$stasisbuff.left_behind=你無法移動的盟友被落在了後面。
runes.spells.stasis$stasisbuff.desc=牧師當前已有盟友被星界投射凝滯狀態。該盟友包括萬物一心在內的所有正面效果都會被凝滯，並且符術效果結束時盟友會在牧師附近再次出現。符術效果還可被再次施放星界投射提前結束。\n\n已凝滯盟友：%1$s\n剩余回合數：%2$s

runes.spells.sunray.name=陽炎射線
runes.spells.sunray.short_desc=造成遠程魔法傷害並致盲目標一次。
runes.spells.sunray.desc=英雄向目標發射致盲光束，通常造成_%1$d~%2$d傷害_並使其失明%3$d回合。陽炎射線必定對亡靈和惡魔目標造成最大傷害。\n\n被該符術擊中後敵人會調節其視覺，以防被射線再次致盲。然而，如果在被該符術致盲後再次被該符術擊中，那麽壓倒性的強光會將其麻痹而非致盲。

runes.spells.walloflight.name=神聖屏障
runes.spells.walloflight.short_desc=創造一面阻擋敵人的屏障。
runes.spells.walloflight.desc=英雄將聖光凝聚為墻壁，在自身面前創造一面1格厚，%1$d格寬，通常持續_20回合_的神聖屏障。\n\n神聖屏障除不遮擋視野外與正常墻壁無異。在屏障被創造時，屏障所困住的敵人會被短暫擊暈並在條件允許的情況下被擊退。屏障所卡住的任何東西都可被取出。\n\n神聖屏障可被八向施放。如果已有屏障存在，則該符術可被免費再次使用以立即驅散屏障。
runes.spells.walloflight.early_end=你驅散了神聖屏障。
runes.spells.walloflight$lightwall.desc=神聖屏障阻擋了此處的通路。

runes.spells.heaveneye.name=天堂之眼
runes.spells.heaveneye.short_desc=召喚一個天堂之眼
runes.spells.heaveneye.desc=在視野內召喚一個天堂之眼。天堂之眼不能移動與戰鬥，但是具有_強大的生命力_和8格靈視，而且可以將視野共享給英雄。\n\n當天堂之眼存在時再次使用該符術，可以僅積累_10回合符文過載_而將天堂之眼傳送到指定位置。
runes.spells.heaveneye$eye.name=天堂之眼
runes.spells.heaveneye$eye.desc=這個生物被符術從天界召喚而來，它無心插手塵世的戰爭，但是樂於與你分享它的視野。天堂之眼擁有強大的生命力與8格靈視。\n\n天堂之眼不會移動，但是再次使用對應符術，可以將天堂之眼傳送到指定位置。
runes.spells.heaveneye$eye.discover_hint=你可通過某種符術發現該單位

###nature spells
runes.spells.evaporating.name=快速蒸發
runes.spells.evaporating.short_desc=蒸發周圍的水面。
runes.spells.evaporating.desc=英雄令自己周圍3*3的水面全部蒸發，變成普通地板。

runes.spells.thunder_sound.name=轟轟雷鳴
runes.spells.thunder_sound.short_desc=在指定位置製造巨響。
runes.spells.thunder_sound.desc=英雄在視野內的指定位置製造巨大的響聲，驚醒本層所有單位並吸引到響聲處。

runes.spells.switch_gravity.name=天旋地轉
runes.spells.switch_gravity.short_desc=讓所有敵人陷入重力混亂。
runes.spells.switch_gravity.desc=英雄操弄著地牢的重力，每經1~3回合，當前樓層的非友方單位都會被拋向某個隨機方向。\n\n重力混亂通常會一共生效_10次_，即持續_10~30回合_。

runes.spells.reversereaction.name=藥劑還原
runes.spells.reversereaction.short_desc=將藥劑還原為種子
runes.spells.reversereaction.desc=將背包中的一瓶藥劑還原為2顆對應種子。\n\n對未鑒定的藥劑和力量藥劑無效。

runes.spells.grassyterrain.name=青草場地
runes.spells.grassyterrain.short_desc=創造一片臨時的青草場地
runes.spells.grassyterrain.desc=以自身為中心創造3*3範圍的青草場地，通常持續_20回合_。在青草場地上英雄可以享受到類似靜謐花園的饑餓減緩效果，而且青草場地會持續長出高草並纏繞敵人。
runes.spells.grassyterrain$grassyterrain.desc=青草場地已經覆蓋此處，會減緩饑餓、擴散植被與纏繞敵人。
runes.spells.grassyterrain$gardenrelax.name=青草滋養
runes.spells.grassyterrain$gardenrelax.desc=腳下的青草場地正在減緩你的饑餓速度。

runes.spells.spincocoon.name=結繭護盾
runes.spells.spincocoon.short_desc=通過結繭來獲得護盾
runes.spells.spincocoon.desc=英雄進入結繭狀態，陷入失明和纏繞護甲中，同時每回合獲得_一些護盾_，持續10回合。\n\n移動會提前結束結繭。
runes.spells.spincocoon$cocoon.name=結繭
runes.spells.spincocoon$cocoon.desc=你正將自己保護在繭中，因此陷入失明和纏繞護甲，同時每回合會獲得_%1$d點護盾_。\n\n結繭還會持續%2$d回合，移動會提前結束結繭。

runes.spells.beansoldier.name=撒豆成兵
runes.spells.beansoldier.short_desc=消耗食物召喚豆兵
runes.spells.beansoldier.desc=英雄消耗背包中的一個食物在自身周圍召喚一個豆兵。豆兵的HP與消耗的食物的飽腹度成正比，最低為1，超出上限的部分會轉化為護盾。
runes.spells.beansoldier.no_space=你周圍沒有空間了。
runes.spells.beansoldier$soldier.name=豆兵
runes.spells.beansoldier$soldier.desc=這個用符術召喚的人偶有著藤木構成的身軀和油彩繪製的臉譜，兼具堅實的防禦與不俗的力量，將成為你可靠的士兵。
runes.spells.beansoldier$soldier.discover_hint=你可通過某種符術發現該單位

###energetic spells
runes.spells.burning.name=熊熊燃燒
runes.spells.burning.short_desc=製造火焰。
runes.spells.burning.desc=英雄在視野內的指定位置製造一格的火焰氣體。

runes.spells.electric_power.name=雷電纏身
runes.spells.electric_power.short_desc=免疫雷電並製造電氣。
runes.spells.electric_power.desc=英雄獲得免疫雷電並不斷在身邊製造電氣的的能力，通常持續_10回合_。

runes.spells.blight.name=閃閃亮光
runes.spells.blight.short_desc=製造光亮並增大視野。
runes.spells.blight.desc=英雄獲得發光狀態與12.5%的視野增大，通常持續_20回合_。
runes.spells.blight$blighting.name=強光
runes.spells.blight$blighting.desc=強力的光芒刺破地牢的黑暗，增大了你的視野。\n\n剩余持續時間：%s回合。

runes.spells.electrictouch.name=電電觸擊
runes.spells.electrictouch.short_desc=為武器攻擊附加電擊傷害與感電。
runes.spells.electrictouch.desc=英雄的下一次武器攻擊附加通常_等於英雄等級的電擊傷害_，並且會對敵人施加感電狀態。\n\n感電的敵人下一次受到的電擊傷害會提高50%。\n\n該符術不消耗時間。
runes.spells.electrictouch$electric_touch.name=電電觸擊
runes.spells.electrictouch$electric_touch.desc=英雄的下一次武器攻擊附加通常_等於英雄等級的電擊傷害_，並且會對敵人施加感電狀態。
runes.spells.electrictouch$electric_feel.name=感電
runes.spells.electrictouch$electric_feel.desc=下一次受到的電擊傷害會提高50%。

runes.spells.firering.name=護體火環
runes.spells.firering.short_desc=用火環灼傷周圍的敵人。
runes.spells.firering.desc=英雄召喚出火環，自動對1格距離內的敵人造成燃燒傷害，並且可以點燃易燃物。通常持續_10回合_。\n\n再次使用該符術可以提前結束而不積累過載。
runes.spells.firering$fireringbuff.name=護體火環
runes.spells.firering$fireringbuff.desc=環繞在你身邊的火環自動對1格距離內的敵人造成燃燒傷害，並且可以點燃易燃物。\n\n剩余回合數：%d。

runes.spells.livingfire.name=活活焚火
runes.spells.livingfire.short_desc=對敵人施加活火。
runes.spells.livingfire.desc=英雄對視野內的敵人施加活火，通常持續_30回合_。\n\n活火會持續點燃宿主，但是不會被水等撲滅。當宿主死亡時，活火還會自動轉移到附近的敵人身上。
runes.spells.livingfire$livingfirebuff.name=活火
runes.spells.livingfire$livingfirebuff.desc=這團活著的火焰無法被水等撲滅，還會持續點燃宿主。當宿主死亡時，活火還會自動轉移到附近的敵人身上。\n\n剩余持續時間：%s回合。

runes.spells.fastcharge.name=閃電快充
runes.spells.fastcharge.short_desc=迅速為背包中的法杖充能。
runes.spells.fastcharge.desc=選擇背包中的一根法杖，為其充能_2點_，背包中的其他法杖充能_1點_。可以超過充能上限。

###physical spells
runes.spells.proofing.name=水火不侵
runes.spells.proofing.short_desc=免疫法術3回合。
runes.spells.proofing.desc=英雄免疫外界的一切法術與元素效果，但是自身依舊可以使用魔法力量，通常持續_3回合_。

runes.spells.framing.name=統統嫁禍
runes.spells.framing.short_desc=轉移自身負面狀態。
runes.spells.framing.desc=英雄將自身的全部負面狀態轉移給視野中的一個目標。

runes.spells.bloodyrunes.name=血祭符文
runes.spells.bloodyrunes.short_desc=消耗HP減輕符文過載。
runes.spells.bloodyrunes.desc=英雄受到10點傷害，減輕50回合的符文過載。\n\n該符術本身不積累過載，且必定成功。

runes.spells.recover.name=自我愈合
runes.spells.recover.short_desc=清除目標的部分負面效果。
runes.spells.recover.desc=清除目標的流血，殘廢，易傷，虛弱，幻惑，降級，定命這些負面效果，並且在接下來的_2回合_免疫這些效果。
runes.spells.recover$recovering.name=自我愈合
runes.spells.recover$recovering.desc=生命力從你的傷口中湧現，可以使你免疫流血，殘廢，易傷，虛弱，幻惑，降級，定命這些負面效果。\n\n剩余持續時間：%s回合。

runes.spells.suppress.name=壓勝魔咒
runes.spells.suppress.short_desc=對目標施加負面效果。
runes.spells.suppress.desc=對目標施加易傷，虛弱和幻惑效果。通常持續_8回合_。

runes.spells.anatomicalview.name=解剖視覺
runes.spells.anatomicalview.short_desc=增加食材掉落率。
runes.spells.anatomicalview.desc=英雄獲得解剖視覺，通常持續_50回合_，期間所有敵人掉落食材的概率翻倍。
runes.spells.anatomicalview$anatomicalviewbuff.name=解剖視覺
runes.spells.anatomicalview$anatomicalviewbuff.desc=你暫時擁有庖丁解牛般的神奇視覺，可以令所有敵人掉落食材的概率翻倍。\n\n剩余持續時間：%s回合。

runes.spells.absorbdamage.name=反轉傷害
runes.spells.absorbdamage.short_desc=將吸收傷害並反轉為治療。
runes.spells.absorbdamage.desc=目標在接下來的_2回合_內免疫並吸收80%的傷害，在持續時間結束時將所吸收傷害的25%轉化為即時治療。
runes.spells.absorbdamage$absorbing.name=反轉傷害
runes.spells.absorbdamage$absorbing.desc=強大的符術正在吸收你受到的大部分傷害，並且會在效果結束時將其部分反轉為即時的治療。\n\n目前已經吸收了%1$s點傷害。該效果將於%2$s回合後結束。

###inverse spells
runes.spells.junior_reshape.name=次級重塑
runes.spells.junior_reshape.short_desc=將一件裝備變為低一階的裝備。
runes.spells.junior_reshape.desc=英雄選擇一件不低於2階的武器、投武或護甲，將其變為低一階的同類物品，保留等級與附魔。\n\n不可以作用於裝備中的物品。
runes.spells.junior_reshape.low_tier=這件裝備的階數太低

runes.spells.senior_reshape.name=高級重塑
runes.spells.senior_reshape.short_desc=將一件裝備變為低一階的裝備。
runes.spells.senior_reshape.desc=英雄選擇壹件武器、投武或護甲。如果沒有附魔則變為低壹階且升級的同類物品。如果有正面附魔則消除並變為同階且升級的同類物品，EX附魔則是升兩級。如果有詛咒附魔則消除並變為同階的同類物品，50%概率升級。\n\n不可以作用於裝備中的物品。
runes.spells.senior_reshape.low_tier=這件裝備的階數太低

runes.spells.swap_between.name=互換位置
runes.spells.swap_between.short_desc=互換兩個單位的位置。
runes.spells.swap_between.desc=英雄選擇視野內兩個不同的單位互換他們的位置。目標可以包括英雄本身，不可以是不能移動的單位。\n\n這個符術需要連續使用兩次來選擇不同目標，第一次使用不積累過載。這個符術不消耗時間。
runes.spells.swap_between.immovable=這個目標不可移動。
runes.spells.swap_between.first_select=選擇第一個目標
runes.spells.swap_between.second_select=選擇第二個目標
runes.spells.swap_between.same_targets=不能選擇兩個相同目標
runes.spells.swap_between.cant_reach=兩個目標不能抵達彼此的位置

runes.spells.chaosoflife.name=生命混亂
runes.spells.chaosoflife.short_desc=讓目標的HP隨機增減。
runes.spells.chaosoflife.desc=使目標的HP隨機增減，對英雄的效果會減弱，對BOSS無效。\n\n該符術最低將目標的HP減為1，最高不能超出HP上限。
runes.spells.chaosoflife.invalid_target=生命混亂對該目標無效。

runes.spells.ascending.name=上向歸反
runes.spells.ascending.short_desc=返回上一層。
runes.spells.ascending.desc=英雄返回上一層的下樓梯處。\n\n該符術在無符文過載時也可能失敗，在空間封鎖時無效。

runes.spells.powerswap.name=力量互換
runes.spells.powerswap.short_desc=交換英雄的攻擊和防禦。
runes.spells.powerswap.desc=交換英雄的武器攻擊力和護甲防禦力，通常持續_10回合_。\n\n如果再次使用可以提前結束且不積累過載。
runes.spells.powerswap$powerswapbuff.name=力量互換
runes.spells.powerswap$powerswapbuff.desc=詭譎的符術正在交換你的攻擊力與防禦力。\n\n剩余持續時間：%s回合。
