##wndrunes
runes.runes.wndlabel=试验符术
runes.runes.wndtitle=点击符文来调整排列组合。每次试验符文组合会消耗一个符文粉尘。\n\n你已经试验了_%1$d/%2$d_种符文组合。
runes.runes.testbtn_yes=试验
runes.runes.testbtn_no=该组合已经试过
runes.runes.test_success=你试验出了%s！
runes.runes.test_fall=这个符文组合是无效的...
runes.runes.no_ash=你没有符文粉尘。
runes.runes.randomtest=随机试验
runes.runes.allknown=你已经试验过全部符文组合。

##wndspell
runes.wndspell.cast_title=施放一个符术
runes.wndspell.info_title=符术信息
runes.wndspell.cast_desc_desktop=选择一个要施放的符术，右键单击获取信息。
runes.wndspell.cast_desc_mobile=选择一个要施放的符术，或按信息按钮切换为信息模式。
runes.wndspell.info_desc=选择一个要了解的符术，或按法器按钮切换为施法模式。
runes.wndspell.cast=施法
runes.wndspell.info=信息
runes.wndspell.cant_cast=你无法施放这个符术。
runes.wndspell.fault=符术失败了！

runes.runicash.name=符文粉尘
runes.runicash.desc=一撮富含魔力的粉尘，是绘制符文的优良材料。你可以使用符文粉尘在法器上试验符文组合。\n\n符文粉尘通过在炼金锅中分解鉴定且无诅咒的武器或护甲获得。

##spells
runes.spells.spell.name=未知符术
runes.spells.spell.desc=测试用的未知符术，无效果。
runes.spells.spell.shortdesc=测试用符术。
runes.spells.spell.type=这是%d阶%s符术。
runes.spells.spell.normal=常规
runes.spells.spell.holy=神圣
runes.spells.spell.nature=自然
runes.spells.spell.energetic=高能
runes.spells.spell.physical=强化
runes.spells.spell.inverse=逆熵
runes.spells.spell.overrunes=这个符术通常会导致_%d回合_的符文过载。
runes.spells.spell.level_punishment=目前地牢的深度不足，使用这个高阶符术导致了符文过载加重。

runes.spells.spell.prompt=选择一个目标
runes.spells.spell.no_target=那里没有任何目标。
runes.spells.spell.invalid_target=你无法以那个位置为目标。
runes.spells.spell.invalid_enemy=你无法以那个敌人为目标。

runes.spells.spell$overrunes.name=符文过载
runes.spells.spell$overrunes.desc=使用符术逸散的符文干扰了你的符文力量，如果剩余回合过多可能导致你的符术失败。\n\n当你处于背水一战时，你必须和BOSS战斗才能降低符文过载。\n\n剩余过载回合：%s回合。这通常会导致_%s%%_的符术失败概率。

###normal spells
runes.spells.eating.name=进食秘法
runes.spells.eating.short_desc=触发一次进食效果
runes.spells.eating.desc=英雄立即触发一次进食天赋效果，但是不会回复饱腹度。

runes.spells.see_though.name=透视容器
runes.spells.see_though.short_desc=观察容器的内容物。
runes.spells.see_though.desc=英雄可以透视观察到一个宝箱、骸骨或坟墓内的物品。如果有多件物品堆叠，只能看见最顶上的物品。\n\n这个符术不消耗时间。
runes.spells.see_though.no_item=这个容器中没有物品！

runes.spells.runiclance.name=符文穿刺
runes.spells.runiclance.short_desc=发射光束攻击穿透的单位。
runes.spells.runiclance.desc=英雄发射一道3格长的光束，对光束穿透的单位造成一次武器攻击，并且通常提高_100%的伤害和200%的附魔强度_。\n\n如果英雄所用武器超重，那么每超1力会额外增加20回合的符文过载。

runes.spells.junior_phantom.name=初级幻影
runes.spells.junior_phantom.short_desc=召唤一个初级幻影
runes.spells.junior_phantom.desc=在视野内召唤一个不能行动且一碰就碎的幻影，但是幻影飘忽不定难以命中。幻影会吸引敌人优先攻击。
runes.spells.junior_phantom$phantom.name=初级幻影
runes.spells.junior_phantom$phantom.desc=一个不能行动且一碰就碎的幻影，但是幻影飘忽不定难以命中。幻影会吸引视野内的敌人优先攻击自身。
runes.spells.junior_phantom$phantom.discover_hint=你可通过某种符术发现该单位

runes.spells.senior_phantom.name=高级幻影
runes.spells.senior_phantom.short_desc=召唤一个高级幻影
runes.spells.senior_phantom.desc=在视野内召唤一个不能行动的幻影，可以承受_一定量的伤害_。幻影会吸引敌人优先攻击。
runes.spells.senior_phantom$phantom.name=高级幻影
runes.spells.senior_phantom$phantom.desc=一个不能行动但是可以承受一定伤害的幻影。幻影会吸引视野内的敌人优先攻击自身。
runes.spells.senior_phantom$phantom.discover_hint=你可通过某种符术发现该单位

runes.spells.runicboom.name=符文爆发
runes.spells.runicboom.short_desc=制造一次爆炸
runes.spells.runicboom.desc=在视野内的一格位置制造一次小型爆炸，伤害通常_等于炸弹_。

runes.spells.animate_armor.name=活化护甲
runes.spells.animate_armor.short_desc=将一件护甲活化
runes.spells.animate_armor.desc=选择背包中的一件护甲，在英雄身边变成一个活化护甲。活化护甲会在召唤处附近徘徊并自动攻击敌人，诅咒的活化护甲则会陷入狂乱。活化护甲的攻击力较弱，但是可以使用护甲的防御力和刻印。\n\n活化护甲死亡后会变回普通的护甲。
runes.spells.animate_armor.no_space=你周围没有空间...
runes.spells.animate_armor.succeed_not_cursed=这件护甲从背包中跳了出来！
runes.spells.animate_armor.succeed_cursed=这件护甲是诅咒的！活化护甲陷入狂乱！
runes.spells.animate_armor$animated_armor.name=活化%s
runes.spells.animate_armor$animated_armor.desc=这件_%s_被活化，徘徊于此处，正在自动攻击接近的敌人。活化护甲的攻击力较弱，但是可以使用护甲的防御力和刻印。\n\n活化护甲死亡后会变回普通的护甲。
runes.spells.animate_armor$animated_armor.cursed=由于这件护甲被诅咒，活化护甲现在陷入狂乱，敌我不分！
runes.spells.animate_armor$animated_armor.discover_hint=你可通过某种符术发现该单位

###holy spells
runes.spells.auraofprotection.name=守御灵光
runes.spells.auraofprotection.short_desc=强化圣骑士与附近盟友的防御。
runes.spells.auraofprotection.desc=圣骑士开始辐射出保护性能量，在自身周围形成一片持续20回合的守御灵光。在圣骑士2格范围内的任何盟友(包括圣骑士自身)都会获得%1$d%%的伤害减免与%2$d%%的圣骑士护甲刻印强化。\n\n该伤害减免优先于其他减伤效果(例如护甲)生效。刻印强化会始终生效，但如果某单位(例如圣骑士自身、虹卫)已从圣骑士的刻印中获得效益，则该符术无法使其再次从中获得效益。
runes.spells.auraofprotection$aurabuff.name=守御灵光
runes.spells.auraofprotection$aurabuff.desc=圣骑士正在自身周围辐射出保护性能量。\n\n附近的任何盟友(包括圣骑士自身)都会获得伤害减免与圣骑士护甲刻印强化。\n\n剩余回合数：%s

runes.spells.beamingray.name=呼神护卫
runes.spells.beamingray.no_space=那里没有空间让你的盟友出现。
runes.spells.beamingray.out_of_range=那个位置超出了范围。
runes.spells.beamingray.short_desc=传送你的盟友并使其获得伤害加成。
runes.spells.beamingray.desc=牧师引导其盟友的力量为可将传送盟友至某个位置的光束。如果光束投射到敌人上，传送光束会将盟友传送至敌人附近并将其作为攻击目标。\n\n传送光束的最大范围为%1$d格，并使万物一心对4格范围内最近敌人的伤害加成提升至%2$d%%，持续10回合。该符术还可以传送通常情况下无法移动的盟友，但若如此则传送光束范围减半。
runes.spells.beamingray$beamingrayboost.name=呼神护卫
runes.spells.beamingray$beamingrayboost.desc=该盟友近期被呼神护卫的传送光束传送，获得传送后对最近敌人的伤害加成。万物一心不会在该效果生效时结束。\n\n剩余回合数：%s

runes.spells.blessspell.name=神圣祝福
runes.spells.blessspell.short_desc=使英雄获得祝福和护盾，使其他单位获得祝福和治疗。
runes.spells.blessspell.desc=英雄赐自身或视野内一个单位神圣祝福。\n\n当神圣祝福以英雄自身为目标时效果更弱，通常使其获得_%1$d回合赐福与%2$d点护盾_。\n\n当神圣祝福以其他单位为目标时效果更强，通常使其获得_%3$d回合赐福与%4$d点治疗_。溢出治疗将被转化为护盾。

runes.spells.bodyform.name=体之位格
runes.spells.bodyform.short_desc=为三位一体选择附魔或刻印。
runes.spells.bodyform.desc=牧师选择一个本局已鉴定的附魔或刻印并使三位一体幻化其效果。\n\n使用三位一体时，牧师会获得所选附魔或刻印的效果%d回合。该临时附魔或刻印具有正常附魔或刻印本应具有的任何效果。\n\n该符术会刷新三位一体当前已幻化的任何体之位格效果。
runes.spells.bodyform$bodyformbuff.name=体之位格
runes.spells.bodyform$bodyformbuff.desc=位格符术体之位格正使你获得附魔或刻印的效果，仿佛你已将其装备于当前的武器或护甲。\n\n注意，体之位格无法复制你已经装备的装备效果。\n\n当前的效果：%1$s\n\n剩余回合数：%2$s

runes.spells.cleanse.name=神圣净化
runes.spells.cleanse.short_desc=清除减益并获得护盾。
runes.spells.cleanse.desc=英雄清除自身和视野内盟友的所有减益效果。此后所有受影响的单位通常还将获得_%d点护盾_。

runes.spells.divinesense.name=神圣感知
runes.spells.divinesense.short_desc=短时间内获得大范围的灵视感知。
runes.spells.divinesense.desc=英雄将其感知集中在周遭环境上，获得通常持续_30回合_，%d格范围的灵视感知。该符术施法不耗时。
runes.spells.divinesense$divinesensetracker.name=神圣感知
runes.spells.divinesense$divinesensetracker.desc=该单位暂时能以其灵视感知看到附近其他生物！\n\n剩余回合数：%s

runes.spells.divineintervention.name=神圣干预
runes.spells.divineintervention.short_desc=大幅强化牧师与盟友的护盾。
runes.spells.divineintervention.desc=牧师借助圣典向自身与盟友体内注入无人能敌的神力，提升全体护盾至%1$d点并延长%2$d回合超凡升天。该符术无可匹敌的防御力与其极高的充能消耗相匹配。\n\n与超凡升天提供的其他护盾一样，这种护盾不会正常衰减，但在超凡升天结束时会立即消失。

runes.spells.flash.name=天堂阶梯
runes.spells.flash.prompt=选择一个位置
runes.spells.flash.short_desc=传送至附近一个位置。
runes.spells.flash.desc=牧师在附近的位置引导出超凡升天的神力并传送到那里。天堂阶梯可以将牧师传送至任何在范围内且未被占据的已探索区域。在同次超凡升天中，每次使用该符术时都会消耗更多的圣典充能。

runes.spells.guidinglight.name=神导之光
runes.spells.guidinglight.short_desc=造成远程魔法必中伤害。
runes.spells.guidinglight.desc=英雄发射一束魔能光矢攻击目标，通常造成_2~8点伤害_并将其启明。对启明敌人的下一次不超力的物理攻击必定命中。
runes.spells.guidinglight$illuminated.name=启明
runes.spells.guidinglight$illuminated.desc=该单位因被神导之光击中而启明。启明的照度不足以照亮周围区域，但其魔法会使英雄对敌人的攻击更容易命中。

runes.spells.hallowedground.name=神圣领域
runes.spells.hallowedground.prompt=选择一个位置
runes.spells.hallowedground.short_desc=治疗盟友，减速敌人并在范围内扩散植被。
runes.spells.hallowedground.desc=英雄将其神圣魔法聚集在附近的地面上，创造一片%1$dx%1$d范围，通常持续_20回合_的神圣领域。\n\n施法时，符术通常会立即治疗所有盟友_15点生命值_(未受伤的的盟友和英雄会获得护盾)，短暂缠绕敌人并扩散矮草。\n\n神圣领域每回合会治疗盟友1点生命值(未受伤的的盟友和英雄会获得护盾)，残废敌人并随机催生高草。\n\n神圣领域会被火焰摧毁。并且如果被动恢复效果被禁用，神圣领域将只会产生枯草。
runes.spells.hallowedground$hallowedterrain.desc=此处已经化为神圣领域。神圣领域会减速敌人、治疗盟友并扩散植被。

runes.spells.holyintuition.name=神圣预知
runes.spells.holyintuition.prompt=选择一个物品
runes.spells.holyintuition.cursed=你感觉到这件物品里潜伏着一股充满恶意的魔力。
runes.spells.holyintuition.uncursed=这个物品没有被诅咒。
runes.spells.holyintuition.short_desc=鉴定一个物品有无诅咒。
runes.spells.holyintuition.desc=英雄将其感知集中在一个物品上，不必装备物品就能判断其诅咒有无。

runes.spells.holylance.name=神圣标枪
runes.spells.holylance.short_desc=造成高额远程魔法伤害。
runes.spells.holylance.desc=英雄将大量能量聚集为一柄致命的投掷用圣枪。圣枪通常造成_%1$d~%2$d点伤害_，并且必定对亡灵和恶魔目标造成最大伤害。\n\n该符术有30回合的冷却。
runes.spells.holylance$lancecooldown.name=神圣标枪-冷却
runes.spells.holylance$lancecooldown.desc=英雄近期施放了神圣标枪，必须等待一段时间才能再次施放。\n\n剩余回合数：%s

runes.spells.holyward.name=神圣护甲
runes.spells.holyward.glyph_name=神圣%s
runes.spells.holyward.glyph_desc=这个刻印略微增加了护甲可防御的伤害量。
runes.spells.holyward.short_desc=临时覆盖刻印以强化护甲防御。
runes.spells.holyward.desc=英雄赋予其身穿护甲神圣刻印，增加护甲1点防御。该符术施法不耗时。\n\n该刻印持续50回合，并会在持续时间内覆盖任何护甲已有的正面刻印。英雄即使没有护甲也能触发神圣刻印效果。
runes.spells.holyward.desc_paladin=_圣骑士施放该符术时效果更强。_神圣护甲的额外伤害防御提升至3点并不再覆盖已有的附魔，而在神圣护甲生效时施放其他符术所使用的每点充能都会延长10回合的符术效果。
runes.spells.holyward$holyarmbuff.name=神圣护甲
runes.spells.holyward$holyarmbuff.desc=英雄已赋予其身穿护甲神圣刻印，临时覆盖任何已有刻印并使护甲额外防御1点伤害。\n\n剩余回合数：%s
runes.spells.holyward$holyarmbuff.desc_paladin=圣骑士已赋予其身穿护甲神圣刻印，使护甲额外防御3点伤害。\n\n神圣护甲生效时施放其他符术所消耗的每点充能都会延长符术效果10回合。\n\n剩余回合数：%s

runes.spells.holyweapon.name=神圣武器
runes.spells.holyweapon.ench_name=神圣%s
runes.spells.holyweapon.ench_desc=被神圣武器攻击的敌人会受到额外魔法伤害。
runes.spells.holyweapon.short_desc=临时覆盖附魔以强化武器伤害。
runes.spells.holyweapon.desc=英雄赋予其手持武器神圣附魔，使武器每次攻击敌人额外造成2点魔法伤害。该符术施法不耗时。\n\n该附魔持续50回合，并会在持续时间内覆盖任何武器已有的正面附魔。赤手空拳攻击敌人也能触发神圣附魔效果。
runes.spells.holyweapon.desc_paladin=_圣骑士施放该符术时效果更强。_神圣武器的额外魔法伤害提升至6点并不再覆盖已有的附魔，而在神圣武器生效时施放其他符术所使用的每点充能都会延长10回合的符术效果。
runes.spells.holyweapon$holywepbuff.name=神圣武器
runes.spells.holyweapon$holywepbuff.desc=英雄已赋予其手持武器神圣附魔，临时覆盖任何已有附魔并使武器每次攻击额外造成2点魔法伤害。\n\n剩余回合数：%s
runes.spells.holyweapon$holywepbuff.desc_paladin=圣骑士已赋予其手持武器神圣附魔，使其攻击额外造成6点魔法伤害。\n\n神圣武器生效时施放其他符术所消耗的每点充能都会延长10回合的符术效果。\n\n剩余回合数：%s

runes.spells.judgement.name=终末天启
runes.spells.judgement.short_desc=对视野内所有敌人造成伤害。
runes.spells.judgement.desc=牧师撕裂苍穹，以圣光之名审判视野内所有敌人。符术会在造成%1$d~%2$d点伤害的基础之上，再根据牧师自进入超凡升天以来(或自上次施放终末天启以来)的每次施法额外造成33%%伤害。\n\n当前终末天启会造成%3$d~%4$d点伤害。

runes.spells.layonhands.name=圣疗之触
runes.spells.layonhands.short_desc=立即治疗附近一个单位或使圣骑士获得护盾。
runes.spells.layonhands.desc=圣骑士以其双手引导出神圣能量，治疗或保护其所触的任何单位。\n\n圣骑士可施放该符术使附近任何单位获得%1$d点治疗，或使自身获得%1$d点护盾。该符术的溢出治疗将被转化为护盾。\n\n该符术可被立即施放、重复施放，但无法立即施加超过三次施法数值的护盾。

runes.spells.lifelinkspell.name=血色羁绊
runes.spells.lifelinkspell.short_desc=与盟友共享所受伤害，并使其获得伤害减免。
runes.spells.lifelinkspell.desc=牧师强化自身与其强化盟友之间的生命联结。该强化版生命联结持续%1$d回合，会使英雄与其盟友共享任何所受伤害，并使万物一心的伤害减免提升至%2$d%%。注意，伤害共享的优先级低于护甲，但高于万物一心的伤害减免。\n\n生命联结效果生效时，对任何一方施放3阶及以下的增益型牧师符术对双方均有效果。
runes.spells.lifelinkspell$lifelinkspellbuff.name=血色羁绊
runes.spells.lifelinkspell$lifelinkspellbuff.desc=牧师近期对该盟友施放了血色羁绊以建立生命联结。\n\n除生命联结的通常效果外，该单位还会获得伤害减免，任何增益型牧师符术对牧师与该盟友施放时对双方均生效，并且万物一心不会在该效果生效时结束。\n\n剩余回合数：%s

runes.spells.mindform.name=智之位格
runes.spells.mindform.short_desc=为三位一体选择法杖或投武。
runes.spells.mindform.desc=牧师选择一个本局已鉴定的法杖或投武并使三位一体幻化其效果。\n\n使用三位一体时，牧师会使用所选物品单次攻击的%d级效果。该次攻击触发正常使用该物品本应触发的所有效果。\n\n该符术会刷新三位一体当前已有的任何智之位格效果。

runes.spells.mnemonicprayer.name=祈愿诗篇
runes.spells.mnemonicprayer.short_desc=延长盟友/敌人的增益/减益效果。
runes.spells.mnemonicprayer.desc=英雄念诵出通常能延长_%1$d回合_特定目标所有增益或减益效果的经文。该符术施法不耗时。增益对盟友(包括英雄自身)持续时间更久，减益对敌人持续时间更久。\n\n祈愿诗篇只能延长一次特定目标的增益或减益效果，并且不能延长来自护甲技能的增益效果。

runes.spells.radiance.name=破晓辐光
runes.spells.radiance.short_desc=启明并暂时击晕视野内敌人。
runes.spells.radiance.desc=祭司通体迸出圣光，击晕所有视野内敌人3回合并使其如同被神导之光击中般启明。若敌人已被启明，符术会触发启明的额外伤害并将其再次启明。若本层视野较暗，符术还会使祭司发光100回合。

runes.spells.recallinscription.name=符文复制
runes.spells.recallinscription.short_desc=重复最近使用的符石或卷轴效果。
runes.spells.recallinscription.desc=英雄使用神圣魔法复制最近使用的符文以再次触发%s回合前使用的卷轴或符石的魔法效果。\n\n符文复制不能复制升级卷轴，充能消耗根据最近一次使用的物品变化而变化：符石2点充能、卷轴3点充能、秘卷4点充能。复制嬗变卷轴或嬗变/升级卷轴的符石/秘卷时，充能消耗还会翻倍。
runes.spells.recallinscription$useditemtracker.name=近期已使用符文
runes.spells.recallinscription$useditemtracker.desc=英雄近期已使用一个兼容符文复制符术效果的物品，可以通过施法再次触发物品效果。\n\n已使用物品：%1$s\n\n剩余回合数：%2$s

runes.spells.shieldoflight.name=神圣护盾
runes.spells.shieldoflight.short_desc=获得仅对单个目标生效的临时护甲。
runes.spells.shieldoflight.desc=英雄在自身与敌人间创造了一面薄弱的圣盾，通常增加其护甲对该敌人持续_5回合_的%1$d~%2$d点防御。\n\n该符术施法不耗时，但不能同时对多个目标使用。
runes.spells.shieldoflight$shieldoflighttracker.name=神圣护盾
runes.spells.shieldoflight$shieldoflighttracker.desc=一面薄弱的圣盾立于该单位与敌人之间。圣盾的强度不足以完全防御攻击，但能将其减弱%1$d~%2$d。\n\n剩余回合数：%s

runes.spells.spiritform.name=魂之位格
runes.spells.spiritform.short_desc=为三位一体选择戒指或神器。
runes.spells.spiritform.desc=牧师选择本局已鉴定的戒指或神器(神圣法典除外)并使三位一体幻化其效果。\n\n如果所选物品为戒指，三位一体会获得所选戒指的%1$d级效果20回合。\n\n如果所选物品为神器，三位一体会复制所选神器的%2$d级效果。三位一体使用神器时的具体效果与护甲充能消耗因神器而异。\n\n该符术会刷新三位一体当前已幻化的任何魂之位格效果。
runes.spells.spiritform$spiritformbuff.name=魂之位格
runes.spells.spiritform$spiritformbuff.desc=位格符术魂之位格正使你获得物品的效果，仿佛你已将其装备于装备栏。\n\n注意，魂之位格无法复制你已经装备的装备效果。\n\n当前的效果：%1$s\n\n剩余回合数：%2$s

runes.spells.smite.name=至圣斩击
runes.spells.smite.short_desc=一次带有额外伤害与附魔强化的必中攻击。
runes.spells.smite.desc=圣骑士为一次致命的近战攻击注入正义之力。\n\n在造成正常近战伤害的基础上，至圣斩使不超力的攻击必定命中，附有300%%的附魔强化并造成%1$d~%2$d点额外魔法伤害。\n\n至圣斩的额外魔法伤害随圣骑士的等级成长而成长，并且至圣斩必定对恶魔和亡灵敌人造成最大额外魔法伤害。

runes.spells.stasis.name=星界投射
runes.spells.stasis.short_desc=将盟友移出地牢并凝滞其状态。
runes.spells.stasis.desc=牧师将其与盟友的联系集中于自身，使盟友暂时化为牧师体内的某种凝滞状态的能量。盟友最多会被凝滞%d回合，而在凝滞状态下，其所有的正面效果均不受时间影响。\n\n符术效果自然结束时盟友会出现在牧师附近，牧师也可无消耗地立即再次施放该符术以提前结束符术效果。星界投射还可移动无法移动的盟友，但无法将其跨层移动。
runes.spells.stasis$stasisbuff.name=星界投射
runes.spells.stasis$stasisbuff.left_behind=你无法移动的盟友被落在了后面。
runes.spells.stasis$stasisbuff.desc=牧师当前已有盟友被星界投射凝滞状态。该盟友包括万物一心在内的所有正面效果都会被凝滞，并且符术效果结束时盟友会在牧师附近再次出现。符术效果还可被再次施放星界投射提前结束。\n\n已凝滞盟友：%1$s\n剩余回合数：%2$s

runes.spells.sunray.name=阳炎射线
runes.spells.sunray.short_desc=造成远程魔法伤害并致盲目标一次。
runes.spells.sunray.desc=英雄向目标发射致盲光束，通常造成_%1$d~%2$d伤害_并使其失明%3$d回合。阳炎射线必定对亡灵和恶魔目标造成最大伤害。\n\n被该符术击中后敌人会调节其视觉，以防被射线再次致盲。然而，如果在被该符术致盲后再次被该符术击中，那么压倒性的强光会将其麻痹而非致盲。

runes.spells.walloflight.name=神圣屏障
runes.spells.walloflight.short_desc=创造一面阻挡敌人的屏障。
runes.spells.walloflight.desc=英雄将圣光凝聚为墙壁，在自身面前创造一面1格厚，%1$d格宽，通常持续_20回合_的神圣屏障。\n\n神圣屏障除不遮挡视野外与正常墙壁无异。在屏障被创造时，屏障所困住的敌人会被短暂击晕并在条件允许的情况下被击退。屏障所卡住的任何东西都可被取出。\n\n神圣屏障可被八向施放。如果已有屏障存在，则该符术可被免费再次使用以立即驱散屏障。
runes.spells.walloflight.early_end=你驱散了神圣屏障。
runes.spells.walloflight$lightwall.desc=神圣屏障阻挡了此处的通路。

runes.spells.heaveneye.name=天堂之眼
runes.spells.heaveneye.short_desc=召唤一个天堂之眼
runes.spells.heaveneye.desc=在视野内召唤一个天堂之眼。天堂之眼不能移动与战斗，但是具有_强大的生命力_和8格灵视，而且可以将视野共享给英雄。\n\n当天堂之眼存在时再次使用该符术，可以仅积累_10回合符文过载_而将天堂之眼传送到指定位置。
runes.spells.heaveneye$eye.name=天堂之眼
runes.spells.heaveneye$eye.desc=这个生物被符术从天界召唤而来，它无心插手尘世的战争，但是乐于与你分享它的视野。天堂之眼拥有强大的生命力与8格灵视。\n\n天堂之眼不会移动，但是再次使用对应符术，可以将天堂之眼传送到指定位置。
runes.spells.heaveneye$eye.discover_hint=你可通过某种符术发现该单位

###nature spells
runes.spells.evaporating.name=快速蒸发
runes.spells.evaporating.short_desc=蒸发周围的水面。
runes.spells.evaporating.desc=英雄令自己周围3*3的水面全部蒸发，变成普通地板。

runes.spells.thunder_sound.name=轰轰雷鸣
runes.spells.thunder_sound.short_desc=在指定位置制造巨响。
runes.spells.thunder_sound.desc=英雄在视野内的指定位置制造巨大的响声，惊醒本层所有单位并吸引到响声处。

runes.spells.switch_gravity.name=天旋地转
runes.spells.switch_gravity.short_desc=让所有敌人陷入重力混乱。
runes.spells.switch_gravity.desc=英雄操弄着地牢的重力，每经1~3回合，当前楼层的非友方单位都会被抛向某个随机方向。\n\n重力混乱通常会一共生效_10次_，即持续_10~30回合_。

runes.spells.reversereaction.name=药剂还原
runes.spells.reversereaction.short_desc=将药剂还原为种子
runes.spells.reversereaction.desc=将背包中的一瓶药剂还原为2颗对应种子。\n\n对未鉴定的药剂和力量药剂无效。

runes.spells.grassyterrain.name=青草场地
runes.spells.grassyterrain.short_desc=创造一片临时的青草场地
runes.spells.grassyterrain.desc=以自身为中心创造3*3范围的青草场地，通常持续_20回合_。在青草场地上英雄可以享受到类似静谧花园的饥饿减缓效果，而且青草场地会持续长出高草并缠绕敌人。
runes.spells.grassyterrain$grassyterrain.desc=青草场地已经覆盖此处，会减缓饥饿、扩散植被与缠绕敌人。
runes.spells.grassyterrain$gardenrelax.name=青草滋养
runes.spells.grassyterrain$gardenrelax.desc=脚下的青草场地正在减缓你的饥饿速度。

runes.spells.spincocoon.name=结茧护盾
runes.spells.spincocoon.short_desc=通过结茧来获得护盾
runes.spells.spincocoon.desc=英雄进入结茧状态，陷入失明和缠绕护甲中，同时每回合获得_一些护盾_，持续10回合。\n\n移动会提前结束结茧。
runes.spells.spincocoon$cocoon.name=结茧
runes.spells.spincocoon$cocoon.desc=你正将自己保护在茧中，因此陷入失明和缠绕护甲，同时每回合会获得_%1$d点护盾_。\n\n结茧还会持续%2$d回合，移动会提前结束结茧。

runes.spells.beansoldier.name=撒豆成兵
runes.spells.beansoldier.short_desc=消耗食物召唤豆兵
runes.spells.beansoldier.desc=英雄消耗背包中的一个食物在自身周围召唤一个豆兵。豆兵的HP与消耗的食物的饱腹度成正比，最低为1，超出上限的部分会转化为护盾。
runes.spells.beansoldier.no_space=你周围没有空间了。
runes.spells.beansoldier$soldier.name=豆兵
runes.spells.beansoldier$soldier.desc=这个用符术召唤的人偶有着藤木构成的身躯和油彩绘制的脸谱，兼具坚实的防御与不俗的力量，将成为你可靠的士兵。
runes.spells.beansoldier$soldier.discover_hint=你可通过某种符术发现该单位

###energetic spells
runes.spells.burning.name=熊熊燃烧
runes.spells.burning.short_desc=制造火焰。
runes.spells.burning.desc=英雄在视野内的指定位置制造一格的火焰气体。

runes.spells.electric_power.name=雷电缠身
runes.spells.electric_power.short_desc=免疫雷电并制造电气。
runes.spells.electric_power.desc=英雄获得免疫雷电并不断在身边制造电气的的能力，通常持续_10回合_。

runes.spells.blight.name=闪闪亮光
runes.spells.blight.short_desc=制造光亮并增大视野。
runes.spells.blight.desc=英雄获得发光状态与12.5%的视野增大，通常持续_20回合_。
runes.spells.blight$blighting.name=强光
runes.spells.blight$blighting.desc=强力的光芒刺破地牢的黑暗，增大了你的视野。\n\n剩余持续时间：%s回合。

runes.spells.electrictouch.name=电电触击
runes.spells.electrictouch.short_desc=为武器攻击附加电击伤害与感电。
runes.spells.electrictouch.desc=英雄的下一次武器攻击附加通常_等于英雄等级的电击伤害_，并且会对敌人施加感电状态。\n\n感电的敌人下一次受到的电击伤害会提高50%。\n\n该符术不消耗时间。
runes.spells.electrictouch$electric_touch.name=电电触击
runes.spells.electrictouch$electric_touch.desc=英雄的下一次武器攻击附加通常_等于英雄等级的电击伤害_，并且会对敌人施加感电状态。
runes.spells.electrictouch$electric_feel.name=感电
runes.spells.electrictouch$electric_feel.desc=下一次受到的电击伤害会提高50%。

runes.spells.firering.name=护体火环
runes.spells.firering.short_desc=用火环灼伤周围的敌人。
runes.spells.firering.desc=英雄召唤出火环，自动对1格距离内的敌人造成燃烧伤害，并且可以点燃易燃物。通常持续_10回合_。\n\n再次使用该符术可以提前结束而不积累过载。
runes.spells.firering$fireringbuff.name=护体火环
runes.spells.firering$fireringbuff.desc=环绕在你身边的火环自动对1格距离内的敌人造成燃烧伤害，并且可以点燃易燃物。\n\n剩余回合数：%d。

runes.spells.livingfire.name=活活焚火
runes.spells.livingfire.short_desc=对敌人施加活火。
runes.spells.livingfire.desc=英雄对视野内的敌人施加活火，通常持续_30回合_。\n\n活火会持续点燃宿主，但是不会被水等扑灭。当宿主死亡时，活火还会自动转移到附近的敌人身上。
runes.spells.livingfire$livingfirebuff.name=活火
runes.spells.livingfire$livingfirebuff.desc=这团活着的火焰无法被水等扑灭，还会持续点燃宿主。当宿主死亡时，活火还会自动转移到附近的敌人身上。\n\n剩余持续时间：%s回合。

runes.spells.fastcharge.name=闪电快充
runes.spells.fastcharge.short_desc=迅速为背包中的法杖充能。
runes.spells.fastcharge.desc=选择背包中的一根法杖，为其充能_2点_，背包中的其他法杖充能_1点_。可以超过充能上限。

###physical spells
runes.spells.proofing.name=金刚不坏
runes.spells.proofing.short_desc=无敌3回合。
runes.spells.proofing.desc=英雄获得无敌状态，免疫一切伤害，通常持续_3回合_。

runes.spells.framing.name=统统嫁祸
runes.spells.framing.short_desc=转移自身负面状态。
runes.spells.framing.desc=英雄将自身的全部负面状态转移给视野中的一个目标。

runes.spells.bloodyrunes.name=血祭符文
runes.spells.bloodyrunes.short_desc=消耗HP减轻符文过载。
runes.spells.bloodyrunes.desc=英雄受到10点伤害，减轻50回合的符文过载。\n\n该符术本身不积累过载，且必定成功。

runes.spells.recover.name=自我愈合
runes.spells.recover.short_desc=清除目标的部分负面效果。
runes.spells.recover.desc=清除目标的流血，残废，易伤，虚弱，幻惑，降级，定命这些负面效果，并且在接下来的_2回合_免疫这些效果。
runes.spells.recover$recovering.name=自我愈合
runes.spells.recover$recovering.desc=生命力从你的伤口中涌现，可以使你免疫流血，残废，易伤，虚弱，幻惑，降级，定命这些负面效果。\n\n剩余持续时间：%s回合。

runes.spells.suppress.name=压胜魔咒
runes.spells.suppress.short_desc=对目标施加负面效果。
runes.spells.suppress.desc=对目标施加易伤，虚弱和幻惑效果。通常持续_8回合_。

runes.spells.anatomicalview.name=解剖视觉
runes.spells.anatomicalview.short_desc=增加食材掉落率。
runes.spells.anatomicalview.desc=英雄获得解剖视觉，通常持续_50回合_，期间所有敌人掉落食材的概率翻倍。
runes.spells.anatomicalview$anatomicalviewbuff.name=解剖视觉
runes.spells.anatomicalview$anatomicalviewbuff.desc=你暂时拥有庖丁解牛般的神奇视觉，可以令所有敌人掉落食材的概率翻倍。\n\n剩余持续时间：%s回合。

runes.spells.absorbdamage.name=反转伤害
runes.spells.absorbdamage.short_desc=将吸收伤害并反转为治疗。
runes.spells.absorbdamage.desc=目标在接下来的_2回合_内免疫并吸收80%的伤害，在持续时间结束时将所吸收伤害的25%转化为即时治疗。
runes.spells.absorbdamage$absorbing.name=反转伤害
runes.spells.absorbdamage$absorbing.desc=强大的符术正在吸收你受到的大部分伤害，并且会在效果结束时将其部分反转为即时的治疗。\n\n目前已经吸收了%1$s点伤害。该效果将于%2$s回合后结束。

###inverse spells
runes.spells.junior_reshape.name=次级重塑
runes.spells.junior_reshape.short_desc=将一件装备变为低一阶的装备。
runes.spells.junior_reshape.desc=英雄选择一件不低于2阶的武器、投武或护甲，将其变为低一阶的同类物品，保留等级与附魔。\n\n不可以作用于装备中的物品。
runes.spells.junior_reshape.low_tier=这件装备的阶数太低

runes.spells.senior_reshape.name=高级重塑
runes.spells.senior_reshape.short_desc=将一件装备变为低一阶的装备。
runes.spells.senior_reshape.desc=英雄选择一件不低于2阶的武器、投武或护甲，将其变为低一阶的同类物品。如果没有附魔则保留等级，有正面附魔则消除并升一级，有EX附魔则消除并升两级，有诅咒附魔则50%概率升一级。\n\n不可以作用于装备中的物品。
runes.spells.senior_reshape.low_tier=这件装备的阶数太低

runes.spells.swap_between.name=互换位置
runes.spells.swap_between.short_desc=互换两个单位的位置。
runes.spells.swap_between.desc=英雄选择视野内两个不同的单位互换他们的位置。目标可以包括英雄本身，不可以是不能移动的单位。\n\n这个符术需要连续使用两次来选择不同目标，第一次使用不积累过载。这个符术不消耗时间。
runes.spells.swap_between.immovable=这个目标不可移动。
runes.spells.swap_between.first_select=选择第一个目标
runes.spells.swap_between.second_select=选择第二个目标
runes.spells.swap_between.same_targets=不能选择两个相同目标
runes.spells.swap_between.cant_reach=两个目标不能抵达彼此的位置

runes.spells.chaosoflife.name=生命混乱
runes.spells.chaosoflife.short_desc=让目标的HP随机增减。
runes.spells.chaosoflife.desc=使目标的HP随机增减，对英雄的效果会减弱，对BOSS无效。\n\n该符术最低将目标的HP减为1，最高不能超出HP上限。
runes.spells.chaosoflife.invalid_target=生命混乱对该目标无效。

runes.spells.ascending.name=上向归反
runes.spells.ascending.short_desc=返回上一层。
runes.spells.ascending.desc=英雄返回上一层的下楼梯处。\n\n该符术在无符文过载时也可能失败，在空间封锁时无效。

runes.spells.powerswap.name=力量互换
runes.spells.powerswap.short_desc=交换英雄的攻击和防御。
runes.spells.powerswap.desc=交换英雄的武器攻击力和护甲防御力，通常持续_10回合_。\n\n如果再次使用可以提前结束且不积累过载。
runes.spells.powerswap$powerswapbuff.name=力量互换
runes.spells.powerswap$powerswapbuff.desc=诡谲的符术正在交换你的攻击力与防御力。\n\n剩余持续时间：%s回合。
